<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Birthday Nazrana! ❤️</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for authentic handwritten, script, and playful rounded typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel+Decorative:wght@400;700&family=Fredoka:wght@500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    :root {
      --crimson: #b31919;
      --crimson-dark: #8a0e0e;
      --gingham-red: rgba(208, 28, 34, 0.88);
      --grid-line: rgba(180, 195, 210, 0.42);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Caveat', cursive, sans-serif;
      background-color: #d31d24;
    }

    /* Classic Red & White Checkered Gingham Border */
    .gingham-backdrop {
      position: fixed;
      inset: 0;
      background-color: #ffffff;
      background-image:
        linear-gradient(90deg, rgba(212, 24, 31, 0.5) 50%, transparent 50%),
        linear-gradient(rgba(212, 24, 31, 0.5) 50%, transparent 50%);
      background-size: 36px 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 3.4vw, 38px);
    }

    /* Inner White Graph / Grid Paper Sheet */
    .paper-sheet {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1280px;
      max-height: 780px;
      background-color: #ffffff;
      background-image:
        linear-gradient(to right, var(--grid-line) 1.2px, transparent 1.2px),
        linear-gradient(to bottom, var(--grid-line) 1.2px, transparent 1.2px);
      background-size: 28px 28px;
      background-position: center center;
      box-shadow: 0 12px 35px rgba(80, 0, 0, 0.22), inset 0 0 25px rgba(0, 0, 0, 0.03);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Typography Helpers */
    .font-script {
      font-family: 'Great Vibes', cursive;
    }
    .font-serif-fancy {
      font-family: 'Cinzel Decorative', serif;
    }
    .font-hand {
      font-family: 'Caveat', cursive;
    }
    .font-rounded {
      font-family: 'Fredoka', sans-serif;
    }

    /* Corner Plush / Fuzzy Stars */
    .corner-star {
      position: fixed;
      z-index: 40;
      pointer-events: none;
      filter: drop-shadow(0 6px 10px rgba(70, 0, 0, 0.35));
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .corner-star-tr {
      top: clamp(2px, 1vw, 12px);
      right: clamp(2px, 1.2vw, 16px);
      width: clamp(92px, 13vw, 175px);
      height: clamp(92px, 13vw, 175px);
      animation: starFloatTR 5s ease-in-out infinite;
    }
    .corner-star-bl {
      bottom: clamp(2px, 1vw, 12px);
      left: clamp(2px, 1.2vw, 16px);
      width: clamp(96px, 13.5vw, 185px);
      height: clamp(96px, 13.5vw, 185px);
      animation: starFloatBL 5.5s ease-in-out infinite;
    }

    @keyframes starFloatTR {
      0%, 100% { transform: rotate(8deg) scale(1); }
      50% { transform: rotate(13deg) scale(1.03); }
    }
    @keyframes starFloatBL {
      0%, 100% { transform: rotate(-10deg) scale(1); }
      50% { transform: rotate(-5deg) scale(1.03); }
    }

    /* Slide Transitions */
    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(14px, 3vw, 36px);
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96) translateY(12px);
      transition: opacity 0.48s ease, transform 0.52s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 10;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) translateY(0);
      z-index: 20;
    }

    .slide.exit-left {
      opacity: 0;
      transform: scale(0.95) translateX(-28px);
    }

    /* Pill Buttons matching video aesthetic */
    .pill-btn {
      background: #ffffff;
      border: 2.5px solid var(--crimson);
      color: var(--crimson);
      border-radius: 9999px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.48rem 2.1rem;
      font-size: clamp(1rem, 1.6vw, 1.35rem);
      box-shadow: 0 3px 0 rgba(179, 25, 25, 0.16), 0 6px 14px rgba(0, 0, 0, 0.06);
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s, box-shadow 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .pill-btn:hover {
      transform: translateY(-2px) scale(1.04);
      background-color: #fff6f6;
      box-shadow: 0 5px 0 rgba(179, 25, 25, 0.2), 0 10px 18px rgba(179, 25, 25, 0.12);
    }
    .pill-btn:active {
      transform: translateY(1px) scale(0.97);
    }

    /* Yes / No Soft Pill Buttons on Slide 2 */
    .choice-btn {
      background: #f5f5f5;
      border: 2px solid #e6e6e6;
      border-radius: 9999px;
      padding: 0.55rem 1.85rem;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(1.1rem, 1.8vw, 1.45rem);
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
    }
    .choice-btn:hover {
      transform: translateY(-3px) scale(1.06);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.13);
    }
    .choice-btn:active {
      transform: scale(0.96);
    }
    .choice-yes {
      background: linear-gradient(180deg, #f3faf3 0%, #e7f4e8 100%);
      border-color: #cde6cf;
      color: #5ea368;
    }
    .choice-no {
      background: linear-gradient(180deg, #fff5f5 0%, #fde8e8 100%);
      border-color: #f6d0d0;
      color: #e05252;
    }

    /* Candle Flame Flicker & Smoke */
    .candle-flame {
      transform-origin: 50% 90%;
      animation: flameFlicker 0.85s ease-in-out infinite alternate;
    }
    @keyframes flameFlicker {
      0% { transform: scale(1) rotate(-2deg); opacity: 0.96; }
      50% { transform: scale(1.08, 0.94) rotate(2deg); opacity: 1; }
      100% { transform: scale(0.95, 1.07) rotate(-1deg); opacity: 0.92; }
    }

    .sparkler-star {
      transform-origin: center;
      animation: sparkleSpin 2.6s linear infinite;
    }
    @keyframes sparkleSpin {
      0% { transform: rotate(0deg) scale(0.94); }
      50% { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(0.94); }
    }

    .smoke-puff {
      opacity: 0;
      pointer-events: none;
    }
    .smoke-puff.active {
      animation: smokeRise 1.6s ease-out forwards;
    }
    @keyframes smokeRise {
      0% { opacity: 0.85; transform: translateY(0) scale(0.6); }
      60% { opacity: 0.55; transform: translateY(-26px) translateX(6px) scale(1.15); }
      100% { opacity: 0; transform: translateY(-48px) translateX(-4px) scale(1.5); }
    }

    /* Gift Box Wiggle */
    .gift-bob {
      animation: giftBob 2.4s ease-in-out infinite;
    }
    @keyframes giftBob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-6px) rotate(-1.5deg); }
      75% { transform: translateY(-4px) rotate(1.5deg); }
    }

    /* Duck Shake on Slide 3 */
    .duck-angry {
      animation: duckPulse 1.8s ease-in-out infinite;
    }
    @keyframes duckPulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      20% { transform: scale(1.03) rotate(-2deg); }
      40% { transform: scale(1.03) rotate(2deg); }
      60% { transform: scale(1.01) rotate(-1deg); }
    }

    /* Envelope Heart Pulse */
    .heart-btn-pulse {
      animation: heartBeat 1.5s ease-in-out infinite;
      cursor: pointer;
    }
    .heart-btn-pulse:hover {
      animation: none;
      transform: scale(1.1);
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }

    /* Envelope Open Animation */
    .envelope-opening {
      animation: envelopePop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes envelopePop {
      0% { transform: scale(1); }
      40% { transform: scale(1.08) rotate(-2deg); }
      100% { transform: scale(0.2) opacity: 0; }
    }

    /* Floating Hearts Gentle Drift */
    .float-slow {
      animation: floatGentle 3.4s ease-in-out infinite;
    }
    .float-slow-delay {
      animation: floatGentle 3.8s ease-in-out 1.1s infinite;
    }
    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    /* Pop-in reveal for Bunny & Party Popper */
    .pop-in {
      animation: popInBounce 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes popInBounce {
      0% { opacity: 0; transform: scale(0.3) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Confetti canvas overlay inside paper sheet */
    #confetti-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 35;
    }
  </style>
</head>
<body>

  <!-- Shared SVG Filters & Gradients for Fuzzy Plush Stars & Hand-drawn Aesthetics -->
  <svg width="0" height="0" class="hidden" aria-hidden="true">
    <defs>
      <!-- Fuzzy Velvet Texture Filter for Corner Stars -->
      <filter id="plush-star-filter" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="5.5" xChannelSelector="R" yChannelSelector="G" result="fuzzy" />
        <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#5c0808" flood-opacity="0.45"/>
      </filter>
      <radialGradient id="plush-red-grad" cx="40%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#c92424"/>
        <stop offset="65%" stop-color="#9e1111"/>
        <stop offset="100%" stop-color="#6e0707"/>
      </radialGradient>
      <linearGradient id="knife-blade" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="55%" stop-color="#cbd5e1"/>
        <stop offset="100%" stop-color="#94a3b8"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- Corner Decorative Fuzzy Stars (Persistent across slides like video) -->
  <svg class="corner-star corner-star-tr" viewBox="0 0 200 200" aria-hidden="true">
    <path filter="url(#plush-star-filter)" fill="url(#plush-red-grad)"
      d="M100,14 C108,14 121,62 128,67 C135,72 184,72 187,80 C190,88 150,118 147,126 C144,134 160,181 153,186 C146,191 107,162 99,162 C91,162 52,191 45,186 C38,181 54,134 51,126 C48,118 8,88 11,80 C14,72 63,72 70,67 C77,62 92,14 100,14 Z" />
  </svg>

  <svg class="corner-star corner-star-bl" viewBox="0 0 200 200" aria-hidden="true">
    <path filter="url(#plush-star-filter)" fill="url(#plush-red-grad)"
      d="M100,14 C108,14 121,62 128,67 C135,72 184,72 187,80 C190,88 150,118 147,126 C144,134 160,181 153,186 C146,191 107,162 99,162 C91,162 52,191 45,186 C38,181 54,134 51,126 C48,118 8,88 11,80 C14,72 63,72 70,67 C77,62 92,14 100,14 Z" />
  </svg>

  <!-- Gingham Frame & Graph Paper Container -->
  <main class="gingham-backdrop">
    <div class="paper-sheet" id="paper-sheet">

      <!-- Sound Toggle Pill (Subtle top-left inside paper) -->
      <button id="sound-toggle" type="button" title="Toggle Sound Effects"
        class="absolute top-3 left-3 z-50 bg-white/90 hover:bg-red-50 text-[#b31919] border border-[#b31919]/40 rounded-full px-3 py-1 text-xs sm:text-sm font-rounded flex items-center gap-1.5 shadow-sm transition cursor-pointer">
        <span id="sound-icon">🔊</span>
        <span id="sound-label" class="hidden sm:inline">Sound On</span>
      </button>

      <!-- Confetti Canvas for Celebrations -->
      <canvas id="confetti-canvas"></canvas>

      <!-- ========================================================= -->
      <!-- SLIDE 1: BIRTHDAY CAKE & MAKE A WISH                      -->
      <!-- ========================================================= -->
      <section id="slide-1" class="slide active" aria-label="Birthday Cake and Make a Wish">
        <!-- Top Bunting Garlands -->
        <div class="w-full flex justify-between items-start px-2 sm:px-8 -mt-2 sm:-mt-4 pointer-events-none">
          <!-- Left Bunting -->
          <svg class="w-36 sm:w-56 md:w-64 h-auto" viewBox="0 0 260 115" fill="none">
            <path d="M5,12 Q125,85 250,15" stroke="#b31919" stroke-width="2.2" fill="none"/>
            <!-- Pennant 1 -->
            <polygon points="24,25 58,42 32,68" fill="#fff" stroke="#b31919" stroke-width="2"/>
            <circle cx="38" cy="43" r="2" fill="#b31919"/><circle cx="45" cy="49" r="2" fill="#b31919"/><circle cx="35" cy="54" r="2" fill="#b31919"/>
            <!-- Pennant 2 -->
            <polygon points="68,45 104,54 82,84" fill="#fff" stroke="#b31919" stroke-width="2"/>
            <line x1="76" y1="53" x2="94" y2="66" stroke="#b31919" stroke-width="1.6"/>
            <line x1="74" y1="62" x2="88" y2="73" stroke="#b31919" stroke-width="1.6"/>
            <!-- Pennant 3 -->
            <polygon points="116,54 152,53 135,86" fill="#fff" stroke="#b31919" stroke-width="2"/>
            <circle cx="134" cy="64" r="2.2" fill="#b31919"/><circle cx="129" cy="72" r="2" fill="#b31919"/><circle cx="140" cy="71" r="2" fill="#b31919"/>
            <!-- Pennant 4 -->
            <polygon points="164,51 198,41 186,75" fill="#fff" stroke="#b31919" stroke-width="2"/>
            <line x1="172" y1="54" x2="192" y2="54" stroke="#b31919" stroke-width="1.6"/>
            <line x1="176" y1="62" x2="189" y2="62" stroke="#b31919" stroke-width="1.6"/>
            <!-- Pennant 5 -->
            <polygon points="208,37 238,22 232,57" fill="#fff" stroke="#b31919" stroke-width="2"/>
            <circle cx="224" cy="36" r="2" fill="#b31919"/><circle cx="227" cy="45" r="2" fill="#b31919"/>
          </svg>

          <!-- Center Title: Happy Birthday -->
          <div class="text-center mt-1 sm:mt-2 z-10 select-none">
            <div class="text-[#b31919] leading-none">
          <!-- Center Title: Happy Birthday Nazrana! -->
          <div class="text-center mt-1 sm:mt-2 z-10 select-none px-1">
            <h1 class="font-rounded font-bold text-[#b31919] text-2xl sm:text-4xl md:text-5xl leading-tight tracking-tight drop-shadow-sm">
              Happy Birthday<br class="sm:hidden" /> <span class="text-[#8a0e0e] underline decoration-[#b31919]/40 decoration-wavy underline-offset-4">Nazrana!</span>
            </h1>
          </div>

          <!-- Right Bunting -->
          <svg class="w-36 sm:w-56 md:w-64 h-auto" viewBox="0 0 260 115" fill="none">
            <path d="M10,15 Q135,85 255,12" stroke="#b31919" stroke-width="2.2" fill="none"/>
            <polygon points="22,22 52,37 28,57" fill="#fff" stroke="#b31919" stroke-width="2"/>
            <circle cx="35" cy="36" r="2" fill="#b31919"/><circle cx="32" cy="45" r="2" fill="#b31919"/>
            <polygon points="62,41 96,51 74,75" fill="#fff" stroke="#b31919" stroke-width="2"/>
            <line x1="68" y1="54" x2="88" y2="54" stroke="#b31919" stroke-width="1.6"/>
            <line x1="71" y1="62" x2="84" y2="62" stroke="#b31919" stroke-width="1.6"/>
            <polygon points="108,53 144,54 125,86" fill="#fff" stroke="#b31919" stroke-width="2"/>
            <circle cx="126" cy="64" r="2.2" fill="#b31919"/><circle cx="120" cy="71" r="2" fill="#b31919"/><circle cx="131" cy="72" r="2" fill="#b31919"/>
            <polygon points="156,54 192,45 178,84" fill="#fff" stroke="#b31919" stroke-width="2"/>
            <line x1="166" y1="66" x2="184" y2="53" stroke="#b31919" stroke-width="1.6"/>
            <line x1="172" y1="73" x2="186" y2="62" stroke="#b31919" stroke-width="1.6"/>
            <polygon points="202,42 236,25 228,68" fill="#fff" stroke="#b31919" stroke-width="2"/>
            <circle cx="222" cy="43" r="2" fill="#b31919"/><circle cx="215" cy="49" r="2" fill="#b31919"/><circle cx="225" cy="54" r="2" fill="#b31919"/>
          </svg>
        </div>

        <!-- Main Middle Row: Left Controls | Center Cake | Right Party Popper & Bunny -->
        <div class="w-full flex-1 grid grid-cols-1 md:grid-cols-12 items-center gap-2 sm:gap-4 px-2 sm:px-6 pb-2">
          
          <!-- Left Column: Make a wish + Blow / Next Button + Floating Hearts -->
          <div class="md:col-span-4 flex flex-col items-center justify-center order-2 md:order-1 z-20">
            <p id="wish-text" class="font-hand font-bold text-[#b31919] text-4xl sm:text-5xl md:text-[3.1rem] mb-2 sm:mb-3 tracking-wide transition-opacity duration-300">
              Make a Wish!
            </p>
            <button id="blow-btn" type="button" class="pill-btn min-w-[145px]">
              Blow
            </button>

            <!-- Small Outline Hearts Cluster below button -->
            <svg class="w-24 h-16 mt-3 sm:mt-5 float-slow hidden sm:block" viewBox="0 0 110 75" fill="none">
              <path d="M28,22 C28,15 18,14 18,22 C18,29 28,35 28,35 C28,35 38,29 38,22 C38,14 28,15 28,22 Z" stroke="#b31919" stroke-width="1.7" transform="rotate(-12 28 24)"/>
              <path d="M68,18 C68,12 59,11 59,18 C59,24 68,30 68,30 C68,30 77,24 77,18 C77,11 68,12 68,18 Z" stroke="#b31919" stroke-width="1.7" transform="rotate(14 68 20)"/>
              <path d="M48,46 C48,39 38,38 38,46 C38,53 48,60 48,60 C48,60 58,53 58,46 C58,38 48,39 48,46 Z" stroke="#b31919" stroke-width="1.7"/>
            </svg>
          </div>

          <!-- Center Column: Hand-drawn 2-Tier Birthday Cake -->
          <div class="md:col-span-4 flex items-center justify-center order-1 md:order-2">
            <svg class="w-56 sm:w-64 md:w-76 lg:w-80 h-auto overflow-visible" viewBox="0 0 320 330" fill="none">
              <!-- Floating Hearts Top Right of Cake -->
              <g class="float-slow">
                <path d="M205,42 C205,31 190,30 190,42 C190,52 205,62 205,62 C205,62 220,52 220,42 C220,30 205,31 205,42 Z" stroke="#b31919" stroke-width="2" fill="#fff"/>
                <path d="M242,68 C242,56 225,55 225,68 C225,79 242,90 242,90 C242,90 259,79 259,68 C259,55 242,56 242,68 Z" stroke="#b31919" stroke-width="2" fill="#fff" transform="rotate(12 242 72)"/>
                <path d="M214,96 C214,88 202,87 202,96 C202,104 214,112 214,112 C214,112 226,104 226,96 C226,87 214,88 214,96 Z" stroke="#b31919" stroke-width="2" fill="#fff" transform="rotate(-8 214 98)"/>
              </g>

              <!-- Sparkler Stick & Burst (Right of Candle) -->
              <line x1="176" y1="142" x2="176" y2="96" stroke="#b31919" stroke-width="2.5" stroke-linecap="round"/>
              <g class="sparkler-star" style="transform-origin: 176px 86px;">
                <polygon points="176,62 180,78 196,72 184,84 198,94 182,92 184,108 176,94 166,106 170,91 154,92 168,83 158,70 172,78"
                  fill="#fff" stroke="#b31919" stroke-width="1.8" stroke-linejoin="round"/>
                <circle cx="176" cy="85" r="3" fill="#ff7b00"/>
              </g>

              <!-- Striped Birthday Candle -->
              <rect x="142" y="88" width="12" height="54" rx="3" fill="#ffffff" stroke="#b31919" stroke-width="2.3"/>
              <line x1="142" y1="100" x2="154" y2="96" stroke="#b31919" stroke-width="2"/>
              <line x1="142" y1="112" x2="154" y2="108" stroke="#b31919" stroke-width="2"/>
              <line x1="142" y1="124" x2="154" y2="120" stroke="#b31919" stroke-width="2"/>
              <line x1="142" y1="136" x2="154" y2="132" stroke="#b31919" stroke-width="2"/>
              <!-- Wick -->
              <line x1="148" y1="88" x2="148" y2="80" stroke="#4a1515" stroke-width="2.2" stroke-linecap="round"/>

              <!-- Lit Candle Flame (Extinguished when Blow is clicked) -->
              <g id="candle-flame-group" class="candle-flame" style="transform-origin: 148px 78px;">
                <path d="M148,46 C158,60 160,74 148,79 C136,74 138,60 148,46 Z" fill="#ff5722" stroke="#b31919" stroke-width="2"/>
                <path d="M148,56 C153,64 154,73 148,76 C142,73 143,64 148,56 Z" fill="#ffeb3b"/>
              </g>

              <!-- Smoke Puffs (Appear when candle is blown out) -->
              <g id="candle-smoke" class="smoke-puff">
                <path d="M148,76 Q140,64 150,54 Q158,44 146,32" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                <circle cx="144" cy="48" r="5" fill="#cbd5e1" opacity="0.7"/>
                <circle cx="153" cy="36" r="7" fill="#cbd5e1" opacity="0.5"/>
              </g>

              <!-- Cake Plate / Platter -->
              <ellipse cx="160" cy="296" rx="126" ry="20" fill="#ffffff" stroke="#b31919" stroke-width="2.6"/>
              <ellipse cx="160" cy="292" rx="112" ry="15" fill="#ffffff" stroke="#b31919" stroke-width="1.8"/>

              <!-- Bottom Tier -->

              <ellipse cx="124" cy="107" rx="7" ry="4" fill="#ff9eb0" opacity="0.85"/>
              <!-- Cat-like Smile -->
              <path d="M92,107 Q96,113 100,108 Q104,113 108,107" stroke="#18181b" stroke-width="2.8" stroke-linecap="round"/>

              <!-- Little Hands Up Near Cheeks -->
              <path d="M58,158 C56,136 66,126 78,128 C84,129 86,138 78,144" fill="#ffffff" stroke="#18181b" stroke-width="3.2" stroke-linecap="round"/>
              <path d="M142,158 C144,136 134,126 122,128 C116,129 114,138 122,144" fill="#ffffff" stroke="#18181b" stroke-width="3.2" stroke-linecap="round"/>
            </svg>

            <button id="replay-btn" type="button" class="pill-btn text-sm sm:text-base px-4 py-1.5 mt-1">
              <span>Replay</span>
              <span>↺</span>
            </button>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script>
    /**
     * Interactive Romantic Birthday Card Controller
     * Handles slide state machine, Web Audio synthesized sound effects,
     * candle blowing + smoke/confetti sequence, and responsive canvas resizing.
     */
    (function () {
      let currentSlide = 1;
      let candleBlown = false;
      let soundEnabled = true;
      let audioCtx = null;

      // DOM References
      const slides = {
        1: document.getElementById('slide-1'),
        2: document.getElementById('slide-2'),
        3: document.getElementById('slide-3'),
        4: document.getElementById('slide-4'),
        5: document.getElementById('slide-5'),
        6: document.getElementById('slide-6'),
        7: document.getElementById('slide-7'),
      };

      const soundToggle = document.getElementById('sound-toggle');
      const soundIcon = document.getElementById('sound-icon');
      const soundLabel = document.getElementById('sound-label');

      const blowBtn = document.getElementById('blow-btn');
      const flameGroup = document.getElementById('candle-flame-group');
      const smokeGroup = document.getElementById('candle-smoke');
      const partyPopperBox = document.getElementById('party-popper-box');
      const bunnyBox = document.getElementById('bunny-celebrate-box');

      const giftYesBtn = document.getElementById('gift-yes-btn');
      const giftNoBtn = document.getElementById('gift-no-btn');
      const tryAgainBtn = document.getElementById('try-again-btn');
      const envelopeCard = document.getElementById('envelope-card');
      const openEnvelopeBtn = document.getElementById('open-envelope-btn');
      const replayBtn = document.getElementById('replay-btn');

      // Confetti Canvas Setup
      const paperSheet = document.getElementById('paper-sheet');
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      let confettiParticles = [];
      let confettiAnimId = null;

      function resizeCanvas() {
        if (!paperSheet || !canvas) return;
        const rect = paperSheet.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
      }
      window.addEventListener('resize', resizeCanvas);

      // Web Audio Synthesizer (Zero external audio dependencies)
      function getAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playSound(type) {
        if (!soundEnabled) return;
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          if (type === 'click') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.09);
          } else if (type === 'blow') {
            // Soft whoosh + celebratory birthday chime
            const bufferSize = ctx.sampleRate * 0.35;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.12));
            }
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;

            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(650, now);

            const nGain = ctx.createGain();
            nGain.gain.setValueAtTime(0.22, now);
            nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

            noise.connect(filter);
            filter.connect(nGain);
            nGain.connect(ctx.destination);
            noise.start(now);

            // Cheerful arpeggio after blow
            const notes = [523.25, 659.25, 783.99, 1046.5];
            notes.forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              const start = now + 0.16 + idx * 0.07;
              osc.frequency.setValueAtTime(freq, start);
              gain.gain.setValueAtTime(0.15, start);
              gain.gain.exponentialRampToValueAtTime(0.001, start + 0.32);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(start);
              osc.stop(start + 0.33);
            });
          } else if (type === 'buzz') {
            // Funny comedic low buzz for "how dare you???"
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(165, now);
            osc.frequency.linearRampToValueAtTime(115, now + 0.28);
            gain.gain.setValueAtTime(0.16, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
          } else if (type === 'chime') {
            // Romantic sparkle chime
            const notes = [587.33, 739.99, 880, 1174.66];
            notes.forEach((freq, i) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              const t = now + i * 0.065;
              osc.frequency.setValueAtTime(freq, t);
              gain.gain.setValueAtTime(0.13, t);
              gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(t);
              osc.stop(t + 0.46);
            });
          }
        } catch (err) {
          // Gracefully ignore audio errors if blocked by browser policy
        }
      }

      // Toggle Sound Button
      soundToggle.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundIcon.textContent = soundEnabled ? '🔊' : '🔇';
        soundLabel.textContent = soundEnabled ? 'Sound On' : 'Muted';
        if (soundEnabled) playSound('click');
      });

      // Confetti Burst Engine
      function triggerConfetti(originXRatio = 0.75, originYRatio = 0.55, count = 65) {
        resizeCanvas();
        const colors = ['#b31919', '#ff4d6d', '#ffd43b', '#ff8787', '#ffa94d', '#e03131'];
        const startX = canvas.width * originXRatio;
        const startY = canvas.height * originYRatio;

        for (let i = 0; i < count; i++) {
          const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.9;
          const speed = 4 + Math.random() * 8.5;
          confettiParticles.push({
            x: startX,
            y: startY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            size: 5 + Math.random() * 6,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * 360,
            rotSpeed: (Math.random() - 0.5) * 12,
            shape: Math.random() > 0.35 ? 'rect' : 'heart',
            life: 1,
          });
        }

        if (!confettiAnimId) {
          renderConfetti();
        }
      }

      function renderConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        confettiParticles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.22; // gravity
          p.vx *= 0.99;
          p.rotation += p.rotSpeed;
          p.life -= 0.011;

          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;

          if (p.shape === 'rect') {
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
          } else {
            const s = p.size * 0.55;
            ctx.beginPath();
            ctx.moveTo(0, s);
            ctx.bezierCurveTo(-s * 1.4, -s * 0.2, -s * 0.6, -s * 1.3, 0, -s * 0.4);
            ctx.bezierCurveTo(s * 0.6, -s * 1.3, s * 1.4, -s * 0.2, 0, s);
            ctx.fill();
          }
          ctx.restore();
        });

        confettiParticles = confettiParticles.filter((p) => p.life > 0 && p.y < canvas.height + 20);
        if (confettiParticles.length > 0) {
          confettiAnimId = requestAnimationFrame(renderConfetti);
        } else {
          confettiAnimId = null;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      // Navigate Between Slides Smoothly
      function goToSlide(targetNum) {
        if (!slides[targetNum] || targetNum === currentSlide) return;
        const prev = slides[currentSlide];
        const next = slides[targetNum];

        prev.classList.remove('active');
        prev.classList.add('exit-left');

        setTimeout(() => {
          prev.classList.remove('exit-left');
        }, 500);

        next.classList.add('active');
        currentSlide = targetNum;
      }

      // Slide 1 Interaction: "Blow" -> Extinguish Candle + Confetti + Cheering Bunny -> "next"
      blowBtn.addEventListener('click', () => {
        if (!candleBlown) {
          candleBlown = true;
          playSound('blow');

          // Extinguish flame & puff smoke
          flameGroup.style.display = 'none';
          smokeGroup.classList.add('active');

          // Swap Party Popper for Cheering Bunny with Party Horn
          partyPopperBox.classList.add('hidden');
          bunnyBox.classList.remove('hidden');
          bunnyBox.classList.add('pop-in');

          // Confetti burst from right side
          triggerConfetti(0.76, 0.54, 70);

          // Change button label to "Next →"
          blowBtn.textContent = 'Next →';
        } else {
          playSound('click');
          goToSlide(2);
        }
      });

      // Slide 2 Interactions: "YES" -> Slide 4 | "NO" -> Slide 3
      giftYesBtn.addEventListener('click', () => {
        playSound('chime');
        goToSlide(4);
      });

      giftNoBtn.addEventListener('click', () => {
        playSound('buzz');
        goToSlide(3);
      });

      // Slide 3 Interaction: "TRY AGAIN" -> Back to Slide 2
      tryAgainBtn.addEventListener('click', () => {
        playSound('click');
        goToSlide(2);
      });

      // Slide 4 Interaction: Heart "OPEN" Button -> Envelope Animation -> Slide 5
      openEnvelopeBtn.addEventListener('click', () => {
        playSound('chime');
        envelopeCard.classList.add('envelope-opening');
        triggerConfetti(0.5, 0.55, 55);

        setTimeout(() => {
          goToSlide(5);
          // Reset envelope animation class after leaving slide
          setTimeout(() => {
            envelopeCard.classList.remove('envelope-opening');
          }, 500);
        }, 420);
      });

      // Slides 5 & 6 "next" Buttons
      document.querySelectorAll('.next-slide-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const nextNum = parseInt(btn.getAttribute('data-next'), 10);
          playSound(nextNum === 7 ? 'chime' : 'click');
          if (nextNum === 7) {
            triggerConfetti(0.5, 0.45, 60);
          }
          goToSlide(nextNum);
        });
      });

      // Slide 7 Replay Button: Resets entire card experience back to Slide 1
      replayBtn.addEventListener('click', () => {
        playSound('click');
        candleBlown = false;
        flameGroup.style.display = '';
        smokeGroup.classList.remove('active');
        partyPopperBox.classList.remove('hidden');
        bunnyBox.classList.add('hidden');
        bunnyBox.classList.remove('pop-in');
        blowBtn.textContent = 'Blow';
        goToSlide(1);
      });

      // Initialize canvas size on window load
      window.onload = function () {
        resizeCanvas();
      };
    })();
  </script>
</body>
